[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changeradar"
version = "0.3.0"
description = "Local-first code change impact analysis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit>=4.3,<5", "pytest>=8.3,<10", "ruff>=0.16,<0.17"]
semantic = ["sentence-transformers>=3,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["src"]
